name: pulsehud
description: "PulseHUD - Live System Wallpaper & Monitor HUD for Android and iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.1
  home_widget: ^0.7.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  google_mobile_ads: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/app_icon_1024.png
